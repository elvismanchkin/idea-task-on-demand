group = io.github.elvismanchkin.taskondemand
version = 0.1.0

# Oldest IDE build supported (2024.3). Keep it low: on-prem teams often run older IDEs.
pluginSinceBuild = 243
platformVersion = 2024.3.6

# The IDE ships its own Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g
